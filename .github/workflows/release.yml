name: Release Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  apply-staged-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      used_staging: ${{ steps.check.outputs.used_staging }}
      discord_blurb: ${{ steps.apply.outputs.discord_blurb }}
    steps:
      - name: Check for staging branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          STAGING_BRANCH="pre-release-staging/$TAG"
          EXISTS=$(gh api "repos/$REPO/branches/$STAGING_BRANCH" --jq '.name' 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "used_staging=true" >> "$GITHUB_OUTPUT"
            echo "Found staging branch: $STAGING_BRANCH"
          else
            echo "used_staging=false" >> "$GITHUB_OUTPUT"
            echo "No staging branch found for $TAG — will fall back to AI generation"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.used_staging == 'true'
        with:
          ref: pre-release-staging/${{ needs.release-please.outputs.tag_name }}
          token: ${{ github.token }}

      - name: Apply staged notes and clean up
        id: apply
        if: steps.check.outputs.used_staging == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_NOTES_FILE=".github/tmp/pre-release-staging/release-notes.md"
          DISCORD_BLURB_FILE=".github/tmp/pre-release-staging/discord-blurb.txt"

          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "::error::Staging branch exists but release-notes.md not found. Aborting."
            exit 1
          fi

          # Apply the staged body to the GitHub release
          gh release edit "$TAG" --repo "$REPO" --notes-file "$RELEASE_NOTES_FILE"
          echo "Applied staged release notes to $TAG"

          # Read discord blurb for downstream jobs
          BLURB=$(cat "$DISCORD_BLURB_FILE" 2>/dev/null || echo "")
          { echo 'discord_blurb<<BLURB_EOF'
            printf '%s\n' "$BLURB"
            echo 'BLURB_EOF'
          } >> "$GITHUB_OUTPUT"

          # Delete the staging branch
          git push origin --delete "pre-release-staging/$TAG" || true
          echo "Deleted staging branch: pre-release-staging/$TAG"

  improve-release-notes:
    needs: [release-please, apply-staged-notes]
    if: >-
      ${{ needs.release-please.outputs.release_created == 'true' &&
          needs.apply-staged-notes.outputs.used_staging == 'false' }}
    uses: ./.github/workflows/local-release-notes.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "RPSandbox"
      project_context: "RPSandbox is a sandbox repo for testing shared GitHub Actions workflows and release automation patterns."
      header: |
        ## RPSandbox

        > Sandbox repo for validating shared workflow patterns across the BojuStudio ecosystem.

        ---
      footer: |
        ---
        🐛 [Report an Issue](https://github.com/ScottKirvan/RPSandbox/issues/new) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y)
    secrets: inherit

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  discord-notify:
    needs: [release-please, apply-staged-notes, improve-release-notes]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      !failure() && !cancelled()
    uses: ./.github/workflows/local-discord-notify.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "RPSandbox"
      discord_blurb: ${{ needs.apply-staged-notes.outputs.discord_blurb || needs.improve-release-notes.outputs.discord_blurb }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEST }}
