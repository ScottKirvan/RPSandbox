name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: "RPSandbox"
      project_context: "RPSandbox is a sandbox repo for testing shared GitHub Actions workflows and release automation patterns."
      header: |
        ## RPSandbox

        > Sandbox repo for validating shared workflow patterns across the BojuStudio ecosystem.

        ---
      footer: |
        ---
        🐛 [Report an Issue](https://github.com/ScottKirvan/RPSandbox/issues/new) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y)
      changelog_path: "notes/CHANGELOG.md"
    secrets: inherit
